[project]
name = "flyvbjerg"
version = "0.1.0"
description = "Agent-first reference-class evidence ledger"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "John Horton"}]
dependencies = [
  "edsl>=1.0",
  "typer>=0.23",
  "rich>=13.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
flyvbjerg = "flyvbjerg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flyvbjerg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
