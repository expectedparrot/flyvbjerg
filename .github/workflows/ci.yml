name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: uv pip install --system -e ".[test]"
      - name: Compile package
        run: python -m compileall -q src simulations/theatrical-musicals/rebuild.py
      - name: Test CLI and executable tutorial
        run: pytest -q
